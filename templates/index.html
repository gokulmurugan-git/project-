<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyMate</title><style>body{margin:0;font-family:Arial;background:#f3f8f4;display:grid;place-items:center;height:100vh}.app{width:min(1000px,95%);height:90vh;background:white;border-radius:24px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px #0002}header{padding:20px;background:#2e7d32;color:white;display:flex;justify-content:space-between}#messages{flex:1;min-height:0;overflow-y:auto;padding:25px}.msg{display:flex;margin:12px 0}.user{justify-content:flex-end}.bubble{max-width:75%;padding:12px 16px;border-radius:16px;background:#e8f5e9;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:#2e7d32;color:white}form{display:flex;padding:15px;border-top:1px solid #ddd;gap:8px}textarea{flex:1;resize:none;padding:12px;border-radius:15px;border:1px solid #ccc}button{padding:12px 18px;border:0;border-radius:12px;background:#2e7d32;color:white;cursor:pointer}</style></head><body><div class="app"><header><b>StudyMate</b><span>Study & Learning</span></header><section id="messages"><div class="msg"><div class="bubble">Welcome! Ask me about study & learning.</div></div></section><form id="form"><textarea id="input" placeholder="Type your question..."></textarea><button>Send</button></form></div><script>const f=document.getElementById('form'),i=document.getElementById('input'),m=document.getElementById('messages');function add(t,c){const r=document.createElement('div');r.className='msg '+c;const b=document.createElement('div');b.className='bubble';b.textContent=t;r.appendChild(b);m.appendChild(r);requestAnimationFrame(()=>m.scrollTop=m.scrollHeight);return r}f.onsubmit=async e=>{e.preventDefault();let t=i.value.trim();if(!t)return;add(t,'user');i.value='';let r=add('StudyMate is thinking...','bot');try{let x=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})});let d=await x.json();r.querySelector('.bubble').textContent=d.reply||'No response.'}catch(e){r.querySelector('.bubble').textContent='Sorry, something went wrong.'}m.scrollTop=m.scrollHeight};i.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();f.requestSubmit()}}</script></body></html>
